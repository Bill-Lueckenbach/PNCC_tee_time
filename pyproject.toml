[project]
name = "PNCC_tee_time"
version = "0.1.0"
description = "Project to automate getting a tee time on PNCC"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Bill Lueckenbach", email = "bill.lueckenbach@gmail.com" }
]
keywords = ["PNCC", "tee time", "auto login"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv>=1.0",
    "selenium>=4.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "mypy", "ruff", "isort"]
docs = ["sphinx"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
pncc_tee_time = "PNCC_tee_time.automation:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "smoke: launch a real browser (requires ChromeDriver on PATH)",
]

# -------------------------------
# Ruff configuration
# -------------------------------
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"